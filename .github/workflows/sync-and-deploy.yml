name: Publicar Simulado Provisório

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar versão confirmada do site
        uses: actions/checkout@v4
        with:
          repository: brunomyckael/cfc-sao-luiz-simulado
          ref: a7e25a7ae9f108b9371057bd6d736aac0cdb53dc
          path: site

      - name: Preparar arquivos públicos
        run: |
          rm -rf site/.git site/.github site/CNAME
          touch site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
